<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Asset</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 102, 255, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 215, 0, 0.12),
                    transparent 35%
                ),
                #06142e;

            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;

            padding: 35px;

            background: rgba(8, 24, 53, 0.9);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .symbol {
            color: #ffd700;
            margin-bottom: 25px;
        }

        label {
            display: block;

            color: #9eacc4;

            font-size: 13px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 9px;

            border: 1px solid #263a60;

            background: #091a38;

            color: white;

            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0066ff,
                #008cff
            );

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #8fa0bd;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>✏️ Edit Asset</h1>

        <div class="symbol">
            {{ asset.symbol }}
        </div>

        <form method="post">

            <label>Asset Name</label>

            <input
                type="text"
                name="asset_name"
                value="{{ asset.asset_name }}"
                required
            >

            <label>Amount</label>

            <input
                type="number"
                name="amount"
                step="any"
                value="{{ asset.amount }}"
                required
            >

            <label>Buy Price</label>

            <input
                type="number"
                name="buy_price"
                step="any"
                value="{{ asset.buy_price }}"
                required
            >

            <button type="submit">
                💾 Save Changes
            </button>

        </form>

        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
