<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Finance Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(0, 102, 255, 0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 215, 0, 0.15),
                    transparent 30%
                ),

                #06142e;

            overflow: hidden;
        }


        /* BACKGROUND EMOJIS */

        .emoji {

            position: fixed;

            font-size: 28px;

            opacity: 0.18;

            animation: float 6s ease-in-out infinite;

            pointer-events: none;
        }

        .e1 {
            top: 12%;
            left: 12%;
        }

        .e2 {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .e3 {
            bottom: 18%;
            left: 18%;
            animation-delay: 2s;
        }

        .e4 {
            bottom: 12%;
            right: 12%;
            animation-delay: 3s;
        }

        .e5 {
            top: 50%;
            left: 5%;
            animation-delay: 1.5s;
        }

        .e6 {
            top: 55%;
            right: 6%;
            animation-delay: 2.5s;
        }


        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }


        /* REGISTER CARD */

        .register-card {

            width: 420px;

            max-width: 90%;

            padding: 40px;

            border-radius: 22px;

            background: rgba(8, 24, 53, 0.90);

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);

            backdrop-filter: blur(15px);

        }


        .logo {

            text-align: center;

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .logo span {

            color: #ffd700;

        }


        .subtitle {

            text-align: center;

            color: #8fa0bd;

            margin-bottom: 30px;

            font-size: 14px;

        }


        h1 {

            text-align: center;

            margin-bottom: 25px;

            font-size: 24px;

        }


        /* ERROR MESSAGE */

        .error-message {

            background: rgba(255, 56, 96, 0.12);

            border: 1px solid rgba(255, 56, 96, 0.35);

            color: #ff6b7d;

            padding: 12px 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: left;

        }


        /* FORM */

        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #9eacc4;

            font-size: 13px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border-radius: 10px;

            border: 1px solid #263a60;

            background: #091a38;

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.2s;

        }


        input:focus {

            border-color: #007bff;

            box-shadow:
                0 0 0 3px rgba(0,123,255,0.12);

        }


        /* BUTTON */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #008cff
                );

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(0,102,255,0.35);

        }


        /* LOGIN LINK */

        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #8292ad;

            font-size: 14px;

        }


        .login-link a {

            color: #4da3ff;

            text-decoration: none;

            font-weight: bold;

        }


        .login-link a:hover {

            color: #ffd700;

        }


        /* SECURITY TEXT */

        .security {

            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #64748b;

        }


        @media(max-width: 500px) {

            .register-card {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND EMOJIS -->

    <div class="emoji e1">₿</div>

    <div class="emoji e2">💵</div>

    <div class="emoji e3">🥇</div>

    <div class="emoji e4">📈</div>

    <div class="emoji e5">💶</div>

    <div class="emoji e6">🪙</div>


    <!-- REGISTER CARD -->

    <div class="register-card">


        <div class="logo">

            📈 Finance <span>Dashboard</span>

        </div>


        <div class="subtitle">

            Build your personal investment portfolio

        </div>


        <h1>

            Create Account 🚀

        </h1>


        {% if error %}

        <div class="error-message">

            ⚠️ {{ error }}

        </div>

        {% endif %}


        <form action="/register" method="post">


            <div class="form-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label>

                    Confirm Password

                </label>

                <input
                    type="password"
                    name="confirmation"
                    placeholder="Repeat your password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <button type="submit">

                ✨ Create Account

            </button>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>


        <div class="security">

            🔒 Your account information is securely protected.

        </div>


    </div>


</body>

</html>
